[package]
name = "poketokenbar"
version = "0.2.3"
description = "PokeTokenBar for Windows"
authors = ["tkdals2317"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "poketokenbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
chrono = "0.4"
fastrand = "2"
ureq = { version = "2", features = ["json"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-notification = "2"
# providers + limits areas: SQLite stores, SHA-256 ids
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# limits area
base64 = "0.22"
percent-encoding = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# providers area: env overrides set with setx live in the registry
winreg = "0.56"
# limits area: Credential Manager (session key, Antigravity token) and SChannel TLS for claude.ai.
keyring = { version = "3", features = ["windows-native"] }
ureq = { version = "2", features = ["native-tls"] }
native-tls = "0.2"
